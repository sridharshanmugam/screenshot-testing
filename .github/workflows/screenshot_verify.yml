name: Screenshot Tests — Verify

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'

concurrency:
  group: screenshot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Paparazzi screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Verify screenshots
        run: ./gradlew verifyPaparazziDebug --stacktrace

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failure-diffs-${{ github.run_number }}
          path: '**/build/paparazzi/failures/'
          retention-days: 7
          if-no-files-found: ignore
