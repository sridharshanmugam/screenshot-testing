name: Screenshot Tests — Verify

on:
  pull_request:
    branches:
      - 'release-**'
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'

concurrency:
  group: screenshot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Paparazzi screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Verify screenshots
        run: ./gradlew verifyPaparazziDebug --stacktrace

      - name: Commit failure diffs to failures branch
        if: failure()
        env:
          FAILURES_BRANCH: ${{ github.head_ref }}-screenshot-verify-failures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add failure diffs — build/ is gitignored so -f is required.
          git add -f app/build/paparazzi/failures/

          if git diff --staged --quiet; then
            echo "::warning::Verify failed but no diff images were produced."
            exit 0
          fi

          git checkout -B "$FAILURES_BRANCH"
          git commit -m "chore: Paparazzi verify failures for ${{ github.head_ref }} [skip ci]"
          git push origin "$FAILURES_BRANCH" --force-with-lease
          echo "::error::Screenshot diffs committed to branch: $FAILURES_BRANCH"

      - name: Delete failures branch on success
        if: success()
        run: |
          git push origin --delete "${{ github.head_ref }}-screenshot-verify-failures" 2>/dev/null \
            || echo "No failures branch to clean up."
