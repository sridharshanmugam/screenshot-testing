name: Screenshot Tests — Verify

# One-time repo setup required:
#   Settings → Pages → Deploy from branch → Branch: gh-pages, Folder: /(root)

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'release-**'
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'

concurrency:
  group: screenshot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Paparazzi screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push to gh-pages
      pull-requests: write  # post PR comment

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Check snapshots directory
        id: snapshots
        run: |
          mkdir -p app/src/test/snapshots
          if [ -z "$(ls -A app/src/test/snapshots)" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No golden images found
        if: steps.snapshots.outputs.empty == 'true'
        run: |
          echo "::error::No golden screenshots found in app/src/test/snapshots/. Trigger the 'Screenshot Tests — Record' workflow to create the initial golden images."
          exit 1

      - name: Verify screenshots
        if: steps.snapshots.outputs.empty == 'false'
        run: ./gradlew verifyPaparazziDebug --stacktrace

      - name: Prepare Paparazzi report for Pages
        if: failure() && steps.snapshots.outputs.empty == 'false'
        run: |
          REPORT_SRC="app/build/reports/tests/testDebugUnitTest"
          REPORT_DST="paparazzi-report"

          if [ -d "$REPORT_SRC" ]; then
            cp -r "$REPORT_SRC" "$REPORT_DST"
            echo "Report copied from $REPORT_SRC"
          else
            # Fallback: expose raw diff images if the HTML report is missing.
            mkdir -p "$REPORT_DST"
            find app/build/paparazzi/failures -name "*.png" \
              -exec cp {} "$REPORT_DST/" \; 2>/dev/null || true
            # Generate a minimal index to list the images.
            python3 - << 'PYEOF'
          import os, pathlib
          dst = pathlib.Path("paparazzi-report")
          images = sorted(p.name for p in dst.glob("*.png"))
          items = "".join(f'<li><img src="{n}" style="max-width:100%"><p>{n}</p></li>' for n in images)
          (dst / "index.html").write_text(
            f"<!DOCTYPE html><html><body><h2>Diff images</h2><ul>{items}</ul></body></html>"
          )
          PYEOF
            echo "Fallback: copied raw diff images."
          fi

      - name: Deploy report to GitHub Pages
        if: failure() && steps.snapshots.outputs.empty == 'false'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: paparazzi-report
          destination_dir: screenshots/pr-${{ github.event.pull_request.number }}
          keep_files: true
          commit_message: "chore: screenshot failure report for PR #${{ github.event.pull_request.number }} [skip ci]"

      - name: Post failure comment on PR
        if: failure() && steps.snapshots.outputs.empty == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const owner     = context.repo.owner;
            const repo      = context.repo.repo;
            const prNumber  = context.issue.number;
            const marker    = "<!-- paparazzi-screenshot-report -->";
            const reportUrl = `https://${owner}.github.io/${repo}/screenshots/pr-${prNumber}/`;

            const body = [
              marker,
              "## Screenshot Test Failures",
              "",
              `**\`${{ github.head_ref }}\`** has screenshot differences that need review.`,
              "",
              `### [View side-by-side failure report →](${reportUrl})`,
              "",
              "_If the changes are intentional, trigger the **Screenshot Tests — Record** workflow to update the golden images._",
            ].join("\n");

            // Update existing bot comment on re-run instead of creating a duplicate.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }
