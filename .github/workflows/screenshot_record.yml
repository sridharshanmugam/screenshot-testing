name: Screenshot Tests — Record

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'release-**'
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'

# Cancel any in-flight record run for the same PR branch when a new commit arrives.
concurrency:
  group: screenshot-record-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record goldens → release-${{ github.head_ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history so we can branch from the exact PR HEAD.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Record Paparazzi goldens
        run: ./gradlew recordPaparazziDebug --stacktrace

      - name: Push goldens to release branch
        env:
          RELEASE_BRANCH: release-${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only snapshot files — ignore any other build output.
          git add app/src/test/snapshots/

          if git diff --staged --quiet; then
            echo "::notice::No golden changes — release branch not updated."
            exit 0
          fi

          # Branch off the current PR HEAD, commit only the golden changes,
          # then force-push so re-runs on the same PR always reflect the latest.
          git checkout -B "$RELEASE_BRANCH"
          git commit -m "chore: record Paparazzi goldens for ${{ github.head_ref }} [skip ci]"
          git push origin "$RELEASE_BRANCH" --force-with-lease
